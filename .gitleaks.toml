# Gitleaks configuration for mdx-docs-site
# https://github.com/gitleaks/gitleaks

title = "mdx-docs-site gitleaks config"

# Extend the default gitleaks rules (100+ built-in patterns)
# This file only needs to define allowlists and custom rules

[extend]
# Use all default rules from gitleaks
useDefault = true

# Paths to ignore during scanning
[allowlist]
  description = "Global allowlist"
  paths = [
    '''node_modules/''',
    '''\.next/''',
    '''pnpm-lock\.yaml''',
    '''\.gitleaks\.toml''',
    '''scripts/scan-secrets\.sh''',  # The script itself contains regex patterns, not real secrets
    '''\.agent/''',
    '''\.agents/''',
    '''\.claude/skills/''',
    '''\.kiro/skills/''',
    '''_bmad/''',
    '''_bmad-output/''',
  ]

# Custom rules specific to this project (on top of gitleaks defaults)
[[rules]]
  id = "plaintext-password"
  description = "Plaintext password in content files"
  regex = '''(?i)(password|passwd)\s*[:=]?\s+[^\s"']{4,}'''
  tags = ["password", "plaintext"]
  [rules.allowlist]
    description = "Ignore code patterns and documentation references"
    regexes = [
      '''process\.env''',
      '''Cypress\.env''',
      '''string\)''',
      '''string\}''',
      '''string>''',
      '''(?i)password\s+(reset|leak|field|hash|NEVER|is|was|for|the|and|or|to|in|on|of|must|should|can|will|may|not|are|has|had|have|with|from|that|this|which|when|where|how|what|why|who|its|our|your|their|his|her|all|any|each|every|both|few|more|most|much|many|some|such|only|just|also|very|often|never|always|still|already|yet|even|now|then|here|there|where|after|before|during|since|until|while|about|above|below|between|into|through|under|over|upon|within|without|along|among|around|behind|beside|beyond|near|off|out|past|toward|across|against|down|inside|outside|up)(?:\s|$)''',
    ]

[[rules]]
  id = "env-file-content"
  description = "Environment variable with sensitive value"
  regex = '''(?i)(DATABASE_URL|MONGO_URI|REDIS_URL)\s*=\s*[^\s]+'''
  tags = ["env", "database"]

[[rules]]
  id = "square-token"
  description = "Square API token"
  regex = '''sq0[a-z]{3}-[a-zA-Z0-9_-]+'''
  tags = ["api", "square"]

[[rules]]
  id = "plaintext-password"
  description = "Plaintext password in content"
  regex = '''(?i)(password|passwd|pass)\s*[:=]?\s+\S{4,}'''
  tags = ["password", "plaintext"]

